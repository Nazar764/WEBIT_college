<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Датчики моніторингу міського шуму, завантажені з API."

    <title>Сенсори міста | Акустична варта</title>
    <link rel="stylesheet" href="style.css" />
